<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>MathRush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>MathRush 🚀</h1>
  <p>Seçim yap:</p>
  <button id="ilkokulBtn">🎒 İlkokul Modu</button>
  <button id="ortaokulBtn">📘 Ortaokul Modu</button>

  <div id="gameArea" style="display:none;">
    <h2 id="question"></h2>
    <input type="number" id="answerInput" placeholder="Cevap">
    <button id="submitBtn">Gönder</button>
    <p id="timer">Süre: 30</p>
    <p id="score">Puan: 0</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
